name: Windows
on: [push, pull_request]
jobs:
  test-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true
      - shell: pwsh
        run: ./scripts/bootstrap.ps1
      - shell: pwsh
        run: |
          $engine=(Get-ChildItem "$env:USERPROFILE/godot" -Recurse -Filter '*win64.exe' | Select-Object -First 1).FullName
          ./scripts/build.ps1 -Godot $engine
      - shell: pwsh
        run: ./scripts/test-exe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-windows
          path: |
            output/guild.exe
            output/*.dll
            output/evidence-*/
            output/exe-*.log
            output/*-error.log
            output/import.log
            output/model.log
            output/export.log
